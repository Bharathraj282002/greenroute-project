<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Green Route System</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
body{
    font-family: "Times New Roman", serif;
    background:#ffffff;
}

/* NAVBAR */
.navbar-custom{
    background:linear-gradient(90deg,#00c6ff,#0072ff);
    padding:15px;
}

.logo{
    font-size:28px;
    font-weight:bold;
    color:white;
}

.nav-link{
    color:white !important;
    font-weight:bold;
    margin:0 10px;
}

.nav-link:hover{
    color:#ffe082 !important;
}

/* CONTAINER */
.main-container{
    margin-top:40px;
    margin-bottom:60px;
}

/* CARD */
.card-box{
    background:#f9f9f9;
    padding:20px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

/* TABLE */
.table{
    background:white;
    border-radius:10px;
    overflow:hidden;
}

.table th{
    background:#0072ff;
    color:white;
    text-align:center;
}

.table td{
    text-align:center;
}

/* BUTTON */
.btn-main{
    background:linear-gradient(90deg,#43e97b,#38f9d7);
    border:none;
    padding:10px 25px;
    border-radius:8px;
    color:white;
    font-weight:bold;
}

/* NEXT BUTTON */
.next-btn{
    margin-top:20px;
    text-align:right;
}

/* FOOTER */
.footer{
    background:#f1f1f1;
    padding:15px;
    text-align:center;
    font-weight:bold;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">

        <div class="logo">
            <i class="fa fa-leaf"></i> Green Route
        </div>

        <div class="ms-auto">
            <a href="/dashboard" class="nav-link">Dashboard</a>
            <a href="/admin" class="nav-link">Admin</a>
            <a href="/login" class="nav-link">Login</a>
        </div>

    </div>
</nav>

<!-- MAIN -->
<div class="container main-container">
    {% block content %}{% endblock %}
</div>

<!-- FOOTER -->
<div class="footer">
    🌱 Eco-Friendly Route Recommendation System
</div>

</body>
</html>
