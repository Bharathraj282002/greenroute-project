<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eco Score Analysis</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<!-- CHART JS -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

/* ================= BODY ================= */
body{
    background:
        radial-gradient(circle at top left,#fff3e6,transparent 40%),
        radial-gradient(circle at bottom right,#ffe0c2,transparent 40%),
        linear-gradient(135deg,#f5f5f5,#eaeaea);
}

/* ================= SIDEBAR ================= */
.sidebar{
    position:fixed;
    top:20px;
    left:20px;
    width:250px;
    height:calc(100vh - 40px);
    padding:25px;
    border-radius:25px;
    background:linear-gradient(180deg,#ff7a00,#ff9900);
    box-shadow:0 25px 60px rgba(255,122,0,0.4);
}

.logo{
    font-size:22px;
    font-weight:700;
    color:#fff;
    margin-bottom:35px;
}

.nav-links{list-style:none;}
.nav-links li{margin-bottom:15px;}

.nav-links a{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 18px;
    border-radius:50px;
    color:#fff;
    text-decoration:none;
    transition:0.3s;
}

.nav-links a:hover{
    background:rgba(0,0,0,0.25);
    transform:translateX(6px);
}

.nav-links a.active{
    background:#000;
}

/* ================= NAVBAR ================= */
.navbar{
    margin-left:300px;
    margin-top:20px;
    margin-right:20px;
    padding:18px 30px;
    border-radius:25px;
    background:linear-gradient(135deg,#ff7a00,#ff9900);
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:#fff;
    box-shadow:0 20px 50px rgba(255,122,0,0.35);
}

/* ================= MAIN ================= */
.main{
    margin-left:300px;
    padding:40px;
}

/* ================= BANNER ================= */
.banner{
    border-radius:25px;
    padding:40px;
    background:linear-gradient(135deg,#000,#1a1a1a);
    color:#fff;
    margin-bottom:30px;
}

/* ================= GRID ================= */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

/* ================= CARD ================= */
.card{
    position:relative;
    padding:25px;
    border-radius:20px;
    background:rgba(255,255,255,0.9);
    backdrop-filter:blur(10px);
    text-align:center;
    overflow:hidden;
}

/* BORDER GLOW */
.card::before{
    content:'';
    position:absolute;
    inset:0;
    border-radius:20px;
    padding:1px;
    background:linear-gradient(135deg,#ff7a00,#ff9900,#ff7a00);

    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;

    pointer-events:none;
}

.card i{
    font-size:30px;
    color:#ff7a00;
    margin-bottom:10px;
}

.card h3{
    margin-bottom:10px;
}

.card p{
    font-size:14px;
    color:#555;
}

/* ================= CHART CARD ================= */
.chart-card{
    margin-top:30px;
    padding:25px;
    border-radius:20px;
    background:rgba(255,255,255,0.9);
    backdrop-filter:blur(10px);
    position:relative;
}

/* BORDER */
.chart-card::before{
    content:'';
    position:absolute;
    inset:0;
    border-radius:20px;
    padding:1px;
    background:linear-gradient(135deg,#ff7a00,#ff9900,#ff7a00);

    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;

    pointer-events:none;
}

canvas{
    max-height:300px;
}

/* ================= RESPONSIVE ================= */
@media(max-width:900px){
    .sidebar{display:none;}
    .navbar,.main{margin-left:0;}
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="logo">ECO ROUTE</div>

    <ul class="nav-links">
        <li><a href="/admin_dashboard"><i class="fa fa-gauge-high"></i> Dashboard</a></li>
        <li><a href="/view_users"><i class="fa fa-users"></i> Users</a></li>
        <li><a href="/process1" class="active"><i class="fa fa-database"></i> Classification</a></li>
        <li><a href="/logout"><i class="fa fa-sign-out-alt"></i> Logout</a></li>
    </ul>
</div>

<!-- NAVBAR -->
<div class="navbar">
    <h3>Eco Score Analysis</h3>
    <div>
        <i class="fa fa-bell"></i>
        <i class="fa fa-user"></i>
        <i class="fa fa-right-from-bracket"></i>
    </div>
</div>

<!-- MAIN -->
<div class="main">

    <!-- BANNER -->
    <div class="banner">
        <h2>Eco Score Insights</h2>
        <p>Distribution of eco-friendly routing performance</p>
    </div>

    <!-- STATS -->
    <div class="grid">

        <div class="card">
            <i class="fa fa-leaf"></i>
            <h3>High Eco Route</h3>
            <p><b>971</b> routes optimized</p>
        </div>

        <div class="card">
            <i class="fa fa-chart-line"></i>
            <h3>Medium Eco Route</h3>
            <p><b>853</b> moderate efficiency</p>
        </div>

        <div class="card">
            <i class="fa fa-exclamation-triangle"></i>
            <h3>Low Eco Route</h3>
            <p><b>698</b> need improvement</p>
        </div>

    </div>

    <!-- CHART -->
    <div class="chart-card">
        <h3><i class="fa fa-chart-bar"></i> Eco Score Distribution</h3>
        <canvas id="ecoChart"></canvas>
    </div>

</div>

<script>

const ctx = document.getElementById('ecoChart');

new Chart(ctx, {
    type: 'bar',
    data: {
        labels: ['High Eco', 'Medium Eco', 'Low Eco'],
        datasets: [{
            label: 'Routes',
            data: [971, 853, 698],
            borderWidth: 1
        }]
    },
    options: {
        responsive: true,
        plugins: {
            legend: {
                display: false
            }
        },
        scales: {
            y: {
                beginAtZero: true
            }
        }
    }
});

</script>

</body>
</html>
